<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Arcade</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <div class="screen" id="start-screen">
      <div class="menu-box">
        <h1 class="title-glow">SNAKE</h1>
        <h2 class="subtitle">ARCADE</h2>
        <p class="menu-desc">Juego clásico con estilo moderno</p>
        
        <div class="mode-selector">
          <button class="mode-btn" id="single-btn">
            <i class="fas fa-user"></i> 1 JUGADOR
          </button>
          <button class="mode-btn" id="multi-btn">
            <i class="fas fa-users"></i> 2 JUGADORES
          </button>
        </div>
        
        <button class="btn btn-secondary" id="leaderboard-btn">
          <i class="fas fa-trophy"></i> LEADERBOARD
        </button>
      </div>
    </div>
    
    <div class="screen hidden" id="game-screen">
      <div class="game-hud">
        <div class="hud-item">
          <span class="hud-label">PUNTAJE</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">NIVEL</span>
          <span class="hud-value" id="level">1</span>
        </div>
        <div class="hud-item" id="player2-hud" style="display: none;">
          <span class="hud-label">P2</span>
          <span class="hud-value" id="score-p2">0</span>
        </div>
        <button class="btn btn-pause" id="pause-btn">
          <i class="fas fa-pause"></i>
        </button>
      </div>
      
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
      </div>
      
      <div class="mobile-controls" id="mobile-controls">
        <div class="dpad">
          <button class="dpad-btn" data-dir="up"><i class="fas fa-chevron-up"></i></button>
          <button class="dpad-btn" data-dir="left"><i class="fas fa-chevron-left"></i></button>
          <button class="dpad-btn" data-dir="down"><i class="fas fa-chevron-down"></i></button>
          <button class="dpad-btn" data-dir="right"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
    
    <div class="screen hidden" id="pause-screen">
      <div class="overlay">
        <div class="modal">
          <h2>PAUSA</h2>
          <p>¿Qué quieres hacer?</p>
          <div class="btn-group">
            <button class="btn btn-primary" id="resume-btn">
              <i class="fas fa-play"></i> CONTINUAR
            </button>
            <button class="btn btn-secondary" id="menu-btn">
              <i class="fas fa-home"></i> MENÚ
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="screen hidden" id="gameover-screen">
      <div class="overlay">
        <div class="modal">
          <h2>GAME OVER</h2>
          <div class="final-score">
            <p class="score-label">PUNTAJE</p>
            <p class="score-value" id="final-score">0</p>
            <p class="level-label">NIVEL</p>
            <p class="level-value" id="final-level">1</p>
          </div>
          <div class="name-input" id="name-input">
            <input type="text" id="player-name" placeholder="TU NOMBRE" maxlength="15">
            <button class="btn btn-primary" id="save-btn">
              <i class="fas fa-save"></i> GUARDAR
            </button>
          </div>
          <div class="btn-group">
            <button class="btn btn-primary" id="restart-btn">
              <i class="fas fa-redo"></i> VOLVER A JUGAR
            </button>
            <button class="btn btn-secondary" id="menu-btn-2">
              <i class="fas fa-home"></i> MENÚ
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="screen hidden" id="winner-screen">
      <div class="overlay">
        <div class="modal">
          <h2 id="winner-text">¡GANADOR!</h2>
          <div class="btn-group">
            <button class="btn btn-primary" id="restart-btn-2">
              <i class="fas fa-redo"></i> VOLVER A JUGAR
            </button>
            <button class="btn btn-secondary" id="menu-btn-3">
              <i class="fas fa-home"></i> MENÚ
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="screen hidden" id="leaderboard-screen">
      <div class="overlay">
        <div class="modal">
          <h2><i class="fas fa-trophy"></i> LEADERBOARD</h2>
          <div class="leaderboard-list" id="leaderboard-list"></div>
          <button class="btn btn-secondary" id="back-btn">
            <i class="fas fa-arrow-left"></i> VOLVER
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/Config.js"></script>
  <script src="js/Audio.js"></script>
  <script src="js/Collisions.js"></script>
  <script src="js/Render.js"></script>
  <script src="js/Game.js"></script>
  <script src="js/UI.js"></script>
</body>
</html>
